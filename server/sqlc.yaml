version: "2"
sql:
  - engine: postgresql
    # The goose migrations are the single source of schema truth; sqlc reads
    # them directly so generated code can never drift from what is deployed.
    schema: migrations
    queries: database/queries
    gen:
      go:
        package: db
        out: database/db
        sql_package: pgx/v5
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
        # numeric columns stay pgtype.Numeric here and are converted to
        # decimal.Decimal in the repository layer. See
        # docs/decisions/0002-numeric-money-mapping.md for why no float64 and
        # no third-party pgx codec is used.
