# Production overlay. Applied on top of docker-compose.yml, never alone:
#
#   docker compose --env-file .env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# which is what `make prod-up` and the btcusd.service systemd unit do.
#
# What this file changes, and why each change only makes sense on the VPS:
#
#   - PostgreSQL is tuned for 4 GB of RAM rather than for the small defaults
#   - container logs are capped, because an unbounded log on a 60 GB disk is a
#     slow-motion outage that ends with PostgreSQL refusing writes
#
# It publishes nothing on the tailnet. Nothing here does: the api is on
# loopback, from the base file, and `tailscale serve` is what puts it on the
# tailnet — over HTTPS, which the PWA requires and which a published port
# cannot provide. See deploy/README.md §2.6 and ADR 0024.
#
# This file used to publish the api on ${TAILSCALE_IP} directly. That is gone
# rather than kept alongside: a page served over HTTPS cannot fetch http://,
# so the plain port could not be what the app talks to, and a second way in
# that only half works is a way to spend an afternoon.
#
# It deliberately does *not* publish PostgreSQL either. Reaching the database
# is an SSH tunnel (`ssh -L 5432:127.0.0.1:5432 <host>`), which is documented
# in deploy/README.md. Nothing on the tailnet needs SQL access, and the smaller
# surface is worth the extra flag when a human wants a psql prompt.

services:
  postgres:
    # Tuned for the 4 GB VPS. The image's own timescaledb-tune writes
    # postgresql.conf at first start; command-line flags override that file, so
    # these win on every start including after an image upgrade.
    #
    # shared_buffers is what PostgreSQL caches for itself. effective_cache_size
    # is not an allocation — it is what the planner is told to *assume* the OS
    # is caching, which is why it can exceed shared_buffers on the same box.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
    logging: &capped
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    logging: *capped

  api:
    environment:
      # JSON log handler, and the level a long-running host should sit at.
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No ports here. The base file publishes 127.0.0.1 and `tailscale serve`
    # proxies to it; adding a tailnet mapping would put a second, plain-HTTP
    # door beside the HTTPS one, and the app cannot use a plain-HTTP door.
    logging: *capped

  collector:
    environment:
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging: *capped
