# Production-shaped compose file: images are built, no source is mounted.
#
# Works under podman and docker alike; nothing here is engine-specific. Note
# that the two keep separate container and volume namespaces, so every command
# against this file has to use the same one — `make engine` reports which the
# Makefile picked.
#
# This file has NO defaults for the values that decide what the system collects
# or what its numbers mean. Those are `${VAR:?...}` and compose refuses to start
# without them.
#
# It used to default them so that `<engine> compose up` worked with no .env at
# all. That convenience cost more than it was worth. Compose looks for `.env` in
# the *project directory* — the directory holding this file, `deploy/` — not at
# the repository root, and there is no `deploy/.env`. So a command that omitted
# --env-file quietly used BTCUSDT on 1m,5m,15m,1h with a `trading` password,
# whatever the root .env said. Editing .env and recreating the containers
# changed nothing, and nothing anywhere said why.
#
# A default that is plausible but not what the operator chose is worse than no
# default at all: the stack comes up healthy, the numbers look ordinary, and
# the mistake is invisible. Ports and log levels still default, because getting
# those wrong announces itself immediately.
#
# Always pass the root .env explicitly:
#   <engine> compose --env-file .env -f deploy/docker-compose.yml up
# which is what `make up` does.

name: btcusd-trading-platform

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env; the development password must not follow the database onto a real host}
      POSTGRES_DB: ${POSTGRES_DB:-btcusd}
      # Keep the server itself in UTC; every timestamp in this system is UTC.
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      # $$ escapes the substitution so the variable is expanded inside the
      # container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback: the database is never exposed to the internet.
      # Published so `make migrate-up` and the integration tests can reach it.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped

  # Applies the schema, then exits. Both api and collector wait for it to
  # finish, so a fresh `compose up` on an empty volume produces a working
  # stack with no manual step — the collector used to crash on a missing
  # table instead, which on a VPS is far less obvious than it is locally.
  #
  # goose is idempotent, so running this on every startup is safe and intended.
  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env; the development password must not follow the database onto a real host}@postgres:5432/${POSTGRES_DB:-btcusd}?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Web UI for reading the database by hand: candles, gaps, collector_status.
  #
  # Behind the `tools` profile, so a plain `compose up` does not start it. It
  # is a browsing tool, not part of the system — the stack that runs on the VPS
  # unattended stays exactly the four services above, and a full SQL console
  # does not sit there for months waiting to be forgotten about. Start it with
  # `make adminer` when it is wanted.
  adminer:
    profiles: ["tools"]
    image: docker.io/library/adminer:latest
    environment:
      # Pre-fills the server field, so only the credentials have to be typed.
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only, exactly like postgres itself. Reaching this from
      # anywhere else is an SSH tunnel:
      #   ssh -L 8081:127.0.0.1:8081 <vps>
      # Adminer's login form is the only thing between a visitor and the whole
      # database, so it must never be published on a public interface.
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    restart: unless-stopped

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: app
      args:
        CMD_PATH: .
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (dev or prod); it selects the log handler}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env; the development password must not follow the database onto a real host}@postgres:5432/${POSTGRES_DB:-btcusd}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      MARKET_SYMBOL: ${MARKET_SYMBOL:?set MARKET_SYMBOL in .env; a default here would silently analyse the wrong instrument}
      MARKET_TYPE: ${MARKET_TYPE:?set MARKET_TYPE in .env (spot or futures)}
      MARKET_TIMEFRAMES: ${MARKET_TIMEFRAMES:?set MARKET_TIMEFRAMES in .env; a default here silently decides what gets collected}
      FEE_TAKER_PCT: ${FEE_TAKER_PCT:?set FEE_TAKER_PCT in .env; costs are configuration and every reported number is net of them}
      SLIPPAGE_TICKS: ${SLIPPAGE_TICKS:?set SLIPPAGE_TICKS in .env; see FEE_TAKER_PCT}
      MARKET_TICK_SIZE: ${MARKET_TICK_SIZE:?set MARKET_TICK_SIZE in .env; without it SLIPPAGE_TICKS has no unit}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://api.binance.com}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://stream.binance.com:9443}
      MARKET_BACKFILL_FROM: ${MARKET_BACKFILL_FROM:?set MARKET_BACKFILL_FROM in .env; it decides how much history exists to evaluate on}
      MARKET_GAPCHECK_INTERVAL: ${MARKET_GAPCHECK_INTERVAL:-15m}
      COLLECTOR_HEARTBEAT_INTERVAL: ${COLLECTOR_HEARTBEAT_INTERVAL:-5s}
      # Delivery. SIGNAL_MODE replaced NOTIFY_ENABLED and the loader rejects
      # the old name, so both services must carry the same value or one starts
      # and the other does not.
      SIGNAL_MODE: ${SIGNAL_MODE:-silent}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # A path INSIDE the container, which is why it is not the host path. The
      # collector mounts FCM_CREDENTIALS_HOST_FILE here read-only; see below.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-/run/secrets/fcm-service-account.json}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Caddy on the host terminates TLS and proxies to this port.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  collector:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: app
      args:
        CMD_PATH: ./collector
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env (dev or prod); it selects the log handler}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env; the development password must not follow the database onto a real host}@postgres:5432/${POSTGRES_DB:-btcusd}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      MARKET_SYMBOL: ${MARKET_SYMBOL:?set MARKET_SYMBOL in .env; a default here would silently analyse the wrong instrument}
      MARKET_TYPE: ${MARKET_TYPE:?set MARKET_TYPE in .env (spot or futures)}
      MARKET_TIMEFRAMES: ${MARKET_TIMEFRAMES:?set MARKET_TIMEFRAMES in .env; a default here silently decides what gets collected}
      FEE_TAKER_PCT: ${FEE_TAKER_PCT:?set FEE_TAKER_PCT in .env; costs are configuration and every reported number is net of them}
      SLIPPAGE_TICKS: ${SLIPPAGE_TICKS:?set SLIPPAGE_TICKS in .env; see FEE_TAKER_PCT}
      MARKET_TICK_SIZE: ${MARKET_TICK_SIZE:?set MARKET_TICK_SIZE in .env; without it SLIPPAGE_TICKS has no unit}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://api.binance.com}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://stream.binance.com:9443}
      MARKET_BACKFILL_FROM: ${MARKET_BACKFILL_FROM:?set MARKET_BACKFILL_FROM in .env; it decides how much history exists to evaluate on}
      MARKET_GAPCHECK_INTERVAL: ${MARKET_GAPCHECK_INTERVAL:-15m}
      COLLECTOR_HEARTBEAT_INTERVAL: ${COLLECTOR_HEARTBEAT_INTERVAL:-5s}
      # Live evaluation. Only the collector runs a strategy; an empty
      # STRATEGY_NAME leaves it collecting candles and nothing else.
      STRATEGY_NAME: ${STRATEGY_NAME:-}
      STRATEGY_TIMEFRAME: ${STRATEGY_TIMEFRAME:-4h}
      STRATEGY_PARAMS: ${STRATEGY_PARAMS:-}
      STRATEGY_TREND_FILTER: ${STRATEGY_TREND_FILTER:-}
      # Outcome tracking. Runs whether or not a strategy is configured: a
      # strategy switched off still has outstanding signals to resolve.
      SIGNAL_EXPIRY_BARS: ${SIGNAL_EXPIRY_BARS:-48}
      OUTCOME_INTERVAL: ${OUTCOME_INTERVAL:-1m}
      # Delivery. SIGNAL_MODE replaced NOTIFY_ENABLED and the loader rejects
      # the old name, so both services must carry the same value or one starts
      # and the other does not.
      SIGNAL_MODE: ${SIGNAL_MODE:-silent}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # A path INSIDE the container, which is why it is not the host path. The
      # collector mounts FCM_CREDENTIALS_HOST_FILE here read-only; see below.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-/run/secrets/fcm-service-account.json}
    # No credentials are mounted here. SIGNAL_MODE=silent is the default and
    # never reads the key, and a bind mount whose source does not exist makes
    # Docker create a directory in its place — which would then fail the read
    # as "is a directory" for everyone who never asked to deliver anything.
    #
    # A notify deployment adds docker-compose.notify.yml, which mounts it.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
