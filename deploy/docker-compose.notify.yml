# The service account key, for a stack that actually delivers.
#
#   docker compose -f docker-compose.yml -f docker-compose.notify.yml up -d
#
# Required when SIGNAL_MODE=notify and pointless otherwise, which is why it is
# an overlay rather than part of the base file: a bind mount whose source does
# not exist makes Docker create a directory in its place, so mounting it by
# default would leave a stray directory in every silent deployment and turn a
# missing key into "is a directory" instead of "no such file".
#
# Set FCM_CREDENTIALS_HOST_FILE to where the key actually is on the host. It
# is a private key: keep it out of the repository — .gitignore already covers
# fcm-service-account.json — and off any path that ends up in an image layer.
#
# Only the collector gets it. The api does not deliver anything and has no
# reason to be able to read a credential.

services:
  collector:
    volumes:
      - ${FCM_CREDENTIALS_HOST_FILE:?set FCM_CREDENTIALS_HOST_FILE to the service account key on this host}:${FCM_CREDENTIALS_FILE:-/run/secrets/fcm-service-account.json}:ro
